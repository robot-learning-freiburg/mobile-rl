name: "fmm"
# defines the observed joints and joints being randomised in the initial pose
joint_model_group_name: "arm_torso"
torso_joint_name: "ewellix_lift_top_joint"
frame_id: "map"
global_link_transform: "panda_hand"
#TODO: set this
tip_to_gripper_offset:
  - 0.05  # 0.18
  - 0.0
  - 0.0
gripper_to_base_rot_offset:
  - 1
  - 0
  - 1
  - 0
base_cmd_topic: "todo"
base_vel_rng: 0.2
base_rot_rng: 1.0
torso_vel_rng: 0.088
z_min: 0.3
z_max: 1.5
restricted_ws_z_min: 0.4
restricted_ws_z_max: 1.4
# max dist the ee plan is allowed to be from a feasible base plan
# Link Lengths: upper arm 400 mm, forearm 321 mm,wrist to gripper surface 120 - 200 mm
# https://tams.informatik.uni-hamburg.de/people/rockel/lectures/ROS_PR2_Introduction.pdf
arm_range: 0.5
gmm_base_offset: 0.02
kinematics_solver_timeout: 0.01
# https://clearpathrobotics.com/ridgeback-indoor-robot-platform/
robot_base_size_meters:
  - 0.96
  - 0.793
inflation_radius_ee: 0.50
# non-default joint values used in the simulator
initial_joint_values:
  ewellix_lift_top_joint: 0.05
  panda_joint1: 0.0
  panda_joint2: 0.0
  panda_joint3: 0.0
  panda_joint4: -1.571
  panda_joint5: 0.0
  panda_joint6: 1.745
  panda_joint7: 0.0
  panda_finger_joint1: 0.035
  panda_finger_joint2: 0.035
gripper_collision_names: []